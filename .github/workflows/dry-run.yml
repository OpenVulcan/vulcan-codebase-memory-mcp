# Manual validation of the complete dedicated native build matrix without publishing.
# 手工验证完整专版原生构建矩阵，但不执行发布。
name: Dry Run Vulcan CBM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version compiled into the dry-run artifacts"
        required: false
        type: string
        default: "dev"

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml

  test:
    needs: [lint]
    uses: ./.github/workflows/_test.yml
    with:
      skip_perf: true
      broad_platforms: true
      shard_suites: true

  build:
    needs: [test]
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ inputs.version }}
      attest: false
