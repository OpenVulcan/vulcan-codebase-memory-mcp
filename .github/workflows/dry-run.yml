# Manual validation of the complete dedicated native build matrix without publishing.
# 手工验证完整专版原生构建矩阵，但不执行发布。
name: Dry Run Vulcan CBM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version compiled into the dry-run artifacts"
        required: false
        type: string
        default: "dev"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ inputs.version }}
      attest: false
