# Dedicated Vulcan CBM release: validate, build five native targets, publish only host assets.
# Vulcan CBM 专版发布：校验、构建五个原生目标，并且只发布宿主资产。
name: Release Vulcan CBM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.0"
        required: true
        type: string
      replace:
        description: "Replace an existing release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ inputs.version }}
      attest: true

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vulcan-cbm-*
          merge-multiple: true

      - name: Verify the exact dedicated release matrix
        run: scripts/ci/verify-vulcan-release-matrix.sh

      - name: Replace an existing release
        if: ${{ inputs.replace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release delete "$VERSION" --yes --cleanup-tag || true

      - name: Create the immutable source tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag -f "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION" --force

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          tag_name: ${{ inputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            vulcan-codebase-memory-mcp-*.tar.gz
            vulcan-codebase-memory-mcp-*.zip
            checksums.txt
