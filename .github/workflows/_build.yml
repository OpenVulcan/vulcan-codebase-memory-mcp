# Reusable native build for the dedicated Vulcan Codebase Memory sidecar.
# Vulcan Codebase Memory 专版 Sidecar 的可复用原生构建。
name: Build Vulcan CBM

on:
  workflow_call:
    inputs:
      version:
        description: "Version string compiled into every native artifact"
        type: string
        default: "dev"
      attest:
        description: "Generate build provenance attestations"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            shell_kind: unix
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            shell_kind: unix
          - runner: macos-15-intel
            platform: macos-x86_64
            shell_kind: unix
          - runner: macos-14
            platform: macos-aarch64
            shell_kind: unix
          - runner: windows-2022
            platform: windows-x86_64
            shell_kind: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Configure Windows CLANG64
        if: matrix.shell_kind == 'windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANG64
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-zlib
            make

      - name: Build dedicated Unix sidecar
        if: matrix.shell_kind == 'unix'
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/build.sh --version "$VERSION"

      - name: Sign dedicated macOS sidecar
        if: startsWith(matrix.platform, 'macos-')
        run: codesign --sign - --force build/c/vulcan-codebase-memory-mcp

      - name: Build dedicated Windows sidecar
        if: matrix.shell_kind == 'windows'
        shell: msys2 {0}
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/build.sh --version "$VERSION" CC=clang CXX=clang++

      - name: Verify dedicated Unix product
        if: matrix.shell_kind == 'unix'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(build/c/vulcan-codebase-memory-mcp --version)" = \
            "vulcan-codebase-memory-mcp ${VERSION#v}"
          test ! -e build/c/codebase-memory-mcp

      - name: Verify dedicated Windows product
        if: matrix.shell_kind == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ExpectedVersion = $env:VERSION.TrimStart("v")
          $ActualVersion = (& .\build\c\vulcan-codebase-memory-mcp.exe --version | Out-String).Trim()
          if ($ActualVersion -cne "vulcan-codebase-memory-mcp $ExpectedVersion") {
              throw "Unexpected dedicated product version: $ActualVersion"
          }
          if (Test-Path -LiteralPath .\build\c\codebase-memory-mcp.exe) {
              throw "Public Codebase Memory artifact must not be produced."
          }

      - name: Run Windows managed end-to-end test
        if: matrix.shell_kind == 'windows'
        shell: pwsh
        run: >
          .\scripts\test-vulcan-managed-windows.ps1
          -Executable .\build\c\vulcan-codebase-memory-mcp.exe

      - name: Package dedicated Unix runtime
        if: matrix.shell_kind == 'unix'
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          PACKAGE_DIR="package-${PLATFORM}"
          mkdir "$PACKAGE_DIR"
          cp build/c/vulcan-codebase-memory-mcp "$PACKAGE_DIR/"
          SHA256=$(shasum -a 256 "$PACKAGE_DIR/vulcan-codebase-memory-mcp" | awk '{print $1}')
          printf '{\n  "protocol": "vulcan.codebase-memory/1",\n  "version": "%s",\n  "platform": "%s",\n  "executable": "vulcan-codebase-memory-mcp",\n  "sha256": "%s"\n}\n' \
            "$VERSION" "$PLATFORM" "$SHA256" > "$PACKAGE_DIR/manifest.json"
          tar -czf "vulcan-codebase-memory-mcp-${PLATFORM}.tar.gz" -C "$PACKAGE_DIR" \
            vulcan-codebase-memory-mcp manifest.json

      - name: Package dedicated Windows runtime
        if: matrix.shell_kind == 'windows'
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.version }}
        run: |
          $Version = $env:VERSION.TrimStart("v")
          $PackageDirectory = Join-Path $PWD "package-$($env:PLATFORM)"
          New-Item -ItemType Directory -Path $PackageDirectory | Out-Null
          $DestinationBinary = Join-Path $PackageDirectory "vulcan-codebase-memory-mcp.exe"
          Copy-Item .\build\c\vulcan-codebase-memory-mcp.exe $DestinationBinary
          $Manifest = [ordered]@{
              protocol = "vulcan.codebase-memory/1"
              version = $Version
              platform = $env:PLATFORM
              executable = "vulcan-codebase-memory-mcp.exe"
              sha256 = (Get-FileHash -Algorithm SHA256 $DestinationBinary).Hash.ToLowerInvariant()
          }
          $Manifest | ConvertTo-Json | Set-Content `
              (Join-Path $PackageDirectory "manifest.json") -Encoding utf8NoBOM
          Compress-Archive -Path "$PackageDirectory\*" `
              -DestinationPath "vulcan-codebase-memory-mcp-$($env:PLATFORM).zip"

      - name: Attest dedicated runtime
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: vulcan-codebase-memory-mcp-${{ matrix.platform }}.*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulcan-cbm-${{ matrix.platform }}
          path: vulcan-codebase-memory-mcp-${{ matrix.platform }}.*
          if-no-files-found: error
